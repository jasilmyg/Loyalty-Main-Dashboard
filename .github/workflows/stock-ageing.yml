name: Daily data auto-load

# 1) Stock ageing: reads the daily "Auto Mailer Stock Reports ALL PRODUCTS" email, downloads the zip and loads
#    the "Detail" sheet into ClickHouse `stock_ageing_report`.
# 2) Sales: loads the daily invoice-wise / item-wise CSVs from the Azure blob container into ClickHouse
#    `azure_invoice_report` and `azure_sales_report` (the blobs are published ~03:00 IST and named with the
#    day AFTER the data, e.g. *_19-11-2026_* holds 18 Nov).
# Both jobs are idempotent: a day that is already loaded is skipped, so running them twice is harmless.
# Runs in the cloud, so no laptop is needed.
on:
  schedule:
    # Off-peak minutes (:13/:17/:41/:47 instead of :00/:30) and early staggered windows
    # so even multi-hour GitHub Actions cron delays finish before 08:00 AM IST.
    - cron: '17 18 * * *'   # 23:47 IST - picks up the 23:36 IST stock email right away
    - cron: '47 21 * * *'   # 03:17 IST - picks up the 03:00 IST Azure sales blobs (+ any late stock email)
    - cron: '13 0 * * *'    # 05:43 IST - early-morning catch-up for stock & sales
    - cron: '41 1 * * *'    # 07:11 IST - final safety net before 08:00 AM IST
  workflow_dispatch:         # instant trigger (manual button or external cloud cron)

# Queue overlapping runs instead of running in parallel (prevents duplicate inserts)
concurrency:
  group: daily-data-auto-load
  cancel-in-progress: false

jobs:
  stock-ageing:
    name: Stock ageing (email -> ClickHouse)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      updated: ${{ steps.load.outputs.updated }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pandas python-calamine clickhouse-connect requests python-dotenv pymysql

      - name: Load latest stock ageing snapshot(s)
        id: load
        working-directory: myg_loyalty_dashboard
        env:
          STOCK_MAIL_USER: ${{ secrets.STOCK_MAIL_USER }}
          STOCK_MAIL_APP_PASSWORD: ${{ secrets.STOCK_MAIL_APP_PASSWORD }}
          CLICKHOUSE_HOST: o4zolc81oe.ap-south-1.aws.clickhouse.cloud
          CLICKHOUSE_PASSWORD: ${{ secrets.CLICKHOUSE_PASSWORD }}
        run: python auto_stock_ageing.py --days 5

  azure-sales:
    name: Sales (Azure blob -> ClickHouse)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      updated: ${{ steps.load.outputs.updated }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pandas clickhouse-connect azure-storage-blob python-dotenv pymysql

      - name: Load missing daily sales files
        id: load
        working-directory: myg_loyalty_dashboard
        env:
          AZURE_BLOB_SAS: ${{ secrets.AZURE_BLOB_SAS }}
          CLICKHOUSE_HOST: o4zolc81oe.ap-south-1.aws.clickhouse.cloud
          CLICKHOUSE_PASSWORD: ${{ secrets.CLICKHOUSE_PASSWORD }}
        run: python auto_azure_sales.py --days 6

  portal-refresh:
    name: Refresh complete portal (snapshots + live cache)
    needs: [stock-ageing, azure-sales]
    if: always() && (needs.stock-ageing.outputs.updated == 'true' || needs.azure-sales.outputs.updated == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install Django djangorestframework whitenoise openpyxl pandas numpy scipy scikit-learn lightgbm clickhouse-connect requests python-dotenv pymysql psycopg2-binary

      - name: Update Demand Forecast snapshots in ClickHouse (all product lines + top 1000 SKUs)
        continue-on-error: true
        working-directory: myg_loyalty_dashboard
        env:
          SKIP_PREWARM: '1'
          PGHOST: '127.0.0.1'
          PGPASSWORD: 'unused'
          CLICKHOUSE_HOST: o4zolc81oe.ap-south-1.aws.clickhouse.cloud
          CLICKHOUSE_PASSWORD: ${{ secrets.CLICKHOUSE_PASSWORD }}
        run: python manage.py snapshot_demand_forecasts --top 1000 --skip-checks

      - name: Trigger live Render portal cache refresh and warm-up
        working-directory: myg_loyalty_dashboard
        env:
          CLICKHOUSE_HOST: o4zolc81oe.ap-south-1.aws.clickhouse.cloud
          CLICKHOUSE_PASSWORD: ${{ secrets.CLICKHOUSE_PASSWORD }}
          PORTAL_REFRESH_TOKEN: ${{ secrets.PORTAL_REFRESH_TOKEN }}
          PORTAL_URL: ${{ vars.PORTAL_URL || 'https://loyalty-main-dashboard.onrender.com' }}
          STOCK_UPDATED: ${{ needs.stock-ageing.outputs.updated }}
          SALES_UPDATED: ${{ needs.azure-sales.outputs.updated }}
        run: python -m analytics.portal_refresh --remote --source github-actions
