{% extends "base.html" %}
{% load static %}

{% block extra_css %}
<style>
:root {
  --bg:#f4f6fb; --card:#ffffff; --border:#e2e8f0;
  --accent:#4f46e5; --accent2:#7c3aed; --gold:#d97706;
  --green:#16a34a; --red:#dc2626; --orange:#ea580c;
  --text:#1e293b; --muted:#64748b; --subtle:#f8fafc;
}
body{background:var(--bg);}
.tcc{background:var(--bg);min-height:100vh;padding-bottom:4rem;}
/* Quarter bar */
.qbar{background:#fff;border-bottom:1px solid var(--border);padding:.85rem 2rem;
  position:sticky;top:0;z-index:200;display:flex;align-items:center;gap:1rem;
  box-shadow:0 1px 8px rgba(0,0,0,.06);}
.qbar-title{font-size:.65rem;font-weight:800;letter-spacing:2px;color:var(--muted);text-transform:uppercase;}
.qbtn{padding:.4rem 1.1rem;border-radius:30px;border:1.5px solid #d1d5db;
  background:#fff;color:var(--muted);font-size:.82rem;font-weight:700;
  cursor:pointer;transition:all .2s;font-family:Inter,sans-serif;}
.qbtn:hover{border-color:var(--accent);color:var(--accent);}
.qbtn.active{background:linear-gradient(135deg,#4f46e5,#7c3aed);border-color:transparent;
  color:#fff;box-shadow:0 4px 14px rgba(79,70,229,.35);}
.qlast{margin-left:auto;font-size:.7rem;color:var(--muted);}
/* Hero */
.hero{background:linear-gradient(135deg,#4f46e5 0%,#7c3aed 60%,#6d28d9 100%);
  border-bottom:1px solid rgba(255,255,255,.15);padding:1.75rem 2rem 1.5rem;position:relative;overflow:hidden;}
.hero::after{content:'';position:absolute;top:-40%;right:-5%;width:450px;height:450px;
  border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.1),transparent 70%);pointer-events:none;}
.hero-title{font-size:1.5rem;font-weight:900;color:#fff;letter-spacing:-.5px;}
.hero-sub{font-size:.82rem;color:rgba(255,255,255,.78);margin-top:.2rem;}
/* Loading */
.tcc-loading{display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:5rem;color:var(--muted);}
.spin{width:40px;height:40px;border:3px solid rgba(79,70,229,.15);
  border-top-color:#4f46e5;border-radius:50%;animation:spin .8s linear infinite;margin-bottom:1rem;}
@keyframes spin{to{transform:rotate(360deg);}}
/* Section */
.tcc-sec{padding:1.75rem 2rem .5rem;}
.tcc-sec-hd{display:flex;align-items:center;gap:.75rem;margin-bottom:1.25rem;}
.sec-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;
  justify-content:center;font-size:1rem;flex-shrink:0;}
.sec-title{font-size:1.1rem;font-weight:800;color:var(--text);letter-spacing:-.3px;}
.sec-sub{font-size:.73rem;color:var(--muted);margin-top:2px;}
.tcc-divider{height:1px;background:var(--border);margin:1.5rem 2rem .5rem;}
/* KPI Grid */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(185px,1fr));gap:1rem;padding:0 2rem;}
.kpi{background:var(--card);border:1px solid var(--border);border-radius:16px;
  padding:1.3rem 1.4rem;position:relative;overflow:hidden;transition:transform .2s,box-shadow .2s;}
.kpi:hover{transform:translateY(-2px);box-shadow:0 8px 28px rgba(0,0,0,.1);}
.kpi::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--ka,#6366f1);}
.kpi-lbl{font-size:.65rem;font-weight:700;letter-spacing:1.2px;color:var(--muted);
  text-transform:uppercase;margin-bottom:.4rem;}
.kpi-val{font-size:1.85rem;font-weight:900;color:var(--text);line-height:1;margin-bottom:.25rem;}
.kpi-sub{font-size:.72rem;color:var(--muted);}
/* Table */
.tbl-wrap{padding:0 2rem;}
.tbl{width:100%;border-collapse:separate;border-spacing:0 4px;font-size:.82rem;}
.tbl th{font-size:.63rem;font-weight:800;text-transform:uppercase;letter-spacing:1px;
  color:var(--muted);padding:.5rem 1rem;border-bottom:1px solid var(--border);}
.tbl td{padding:.75rem 1rem;color:var(--text);background:var(--card);
  border-top:1px solid var(--border);}
.tbl tr td:first-child{border-radius:8px 0 0 8px;}
.tbl tr td:last-child{border-radius:0 8px 8px 0;}
.tbl tbody tr:hover td{background:#f1f4ff;}
.risk{display:inline-block;padding:.2rem .6rem;border-radius:20px;
  font-size:.63rem;font-weight:800;text-transform:uppercase;letter-spacing:.5px;}
.rH{background:#fee2e2;color:#dc2626;}
.rM{background:#ffedd5;color:#ea580c;}
.rL{background:#dcfce7;color:#16a34a;}
/* Card grids */
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:1rem;padding:0 2rem;}
.card-g{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:1.3rem;
  transition:transform .2s;}
.card-g:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,.08);}
.cg-title{font-size:.88rem;font-weight:700;color:var(--text);margin-bottom:.6rem;}
.cg-row{display:flex;justify-content:space-between;margin-bottom:.3rem;}
.cg-lbl{font-size:.68rem;color:var(--muted);}
.cg-val{font-size:.82rem;font-weight:700;color:var(--text);}
.cbar{height:4px;background:#e2e8f0;border-radius:4px;margin-top:.6rem;overflow:hidden;}
.cfill{height:100%;border-radius:4px;}
/* Reco */
.reco-list{padding:0 2rem;display:flex;flex-direction:column;gap:.7rem;}
.reco{background:var(--card);border:1px solid var(--border);border-radius:12px;
  padding:1.1rem 1.4rem;display:flex;align-items:center;gap:.9rem;transition:all .2s;}
.reco:hover{border-color:#c7d2fe;transform:translateX(4px);box-shadow:0 4px 14px rgba(79,70,229,.1);}
.rn{width:30px;height:30px;border-radius:9px;flex-shrink:0;
  background:linear-gradient(135deg,#4f46e5,#7c3aed);display:flex;align-items:center;
  justify-content:center;font-size:.82rem;font-weight:900;color:#fff;}
.reco-txt{flex:1;font-size:.88rem;font-weight:600;color:var(--text);}
.reco-meta{font-size:.7rem;color:var(--muted);margin-top:.15rem;}
.gain-val{font-size:1.05rem;font-weight:900;color:#16a34a;}
.gain-lbl{font-size:.62rem;color:var(--muted);text-transform:uppercase;}
/* What-if */
.sim-grid{padding:0 2rem;display:grid;grid-template-columns:1fr 320px;gap:1.5rem;}
.sim-ctrl{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:1.5rem;}
.sim-out{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:1.5rem;}
.sl-wrap{margin-bottom:1.1rem;}
.sl-lbl{display:flex;justify-content:space-between;font-size:.76rem;font-weight:600;
  color:var(--text);margin-bottom:.35rem;}
.sl-v{color:#4f46e5;font-weight:800;}
input[type=range]{width:100%;-webkit-appearance:none;height:4px;background:#e2e8f0;
  border-radius:4px;outline:none;}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;
  border-radius:50%;background:linear-gradient(135deg,#6366f1,#8b5cf6);cursor:pointer;
  box-shadow:0 0 10px rgba(79,70,229,.35);}
.sim-r-item{padding:.75rem 1rem;background:var(--subtle);border:1px solid var(--border);border-radius:10px;margin-bottom:.75rem;}
.sim-r-lbl{font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);}
.sim-r-val{font-size:1.5rem;font-weight:900;color:var(--text);margin-top:.15rem;}
/* Exec */
.exec-panel{background:linear-gradient(135deg,#f8faff,#f1f4ff);
  border:1px solid #c7d2fe;border-radius:20px;padding:2rem;
  box-shadow:0 4px 24px rgba(79,70,229,.08);}
.exec-summary{font-size:.88rem;line-height:1.8;color:#374151;padding:1rem;
  background:#fff;border-radius:10px;margin-bottom:1.5rem;
  border-left:3px solid var(--accent);box-shadow:0 1px 4px rgba(0,0,0,.04);}
.exec-decisions{display:grid;grid-template-columns:1fr 1fr;gap:.7rem;}
.exec-dec{background:#fff;border:1px solid #c7d2fe;
  border-radius:10px;padding:.8rem 1rem;font-size:.8rem;color:var(--text);
  display:flex;align-items:center;gap:.5rem;box-shadow:0 1px 4px rgba(0,0,0,.03);}
.exec-dec::before{content:'▶';color:var(--accent);font-size:.62rem;flex-shrink:0;}
/* Leader */
.lead-grid{display:grid;grid-template-columns:1fr 1fr;gap:1.5rem;padding:0 2rem;}
.lead-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:1.5rem;}
.lead-title{font-size:.75rem;font-weight:800;text-transform:uppercase;letter-spacing:1px;
  color:var(--muted);margin-bottom:1rem;}
.lead-item{display:flex;align-items:center;gap:.7rem;padding:.55rem 0;
  border-bottom:1px solid var(--border);}
.lead-item:last-child{border-bottom:none;}
.lead-rank{font-size:.72rem;font-weight:800;width:20px;color:var(--muted);}
.lead-name{flex:1;font-size:.83rem;font-weight:600;color:var(--text);}
.lead-val{font-size:.83rem;font-weight:700;color:#4f46e5;}
/* Gauge */
.gauge-wrap{background:var(--card);border:1px solid var(--border);border-radius:16px;
  padding:2rem;display:flex;flex-direction:column;align-items:center;}
.gauge-lbl{text-align:center;margin-top:.5rem;font-size:.78rem;color:var(--muted);}
/* Prob grid */
.prob-grid{display:grid;grid-template-columns:280px 1fr;gap:1.5rem;padding:0 2rem;}
.prob-cards{display:grid;grid-template-columns:1fr 1fr;gap:.9rem;align-content:start;}
.prob-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:1.1rem 1.3rem;}
.pc-lbl{font-size:.65rem;font-weight:700;letter-spacing:1px;color:var(--muted);text-transform:uppercase;margin-bottom:.35rem;}
.pc-val{font-size:1.4rem;font-weight:900;color:var(--text);}
/* Status */
.spill{display:inline-flex;align-items:center;gap:.35rem;padding:.28rem .8rem;
  border-radius:30px;font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.5px;}
.s-ok{background:#dcfce7;color:#15803d;}
.s-rec{background:#ffedd5;color:#c2410c;}
.s-risk{background:#fee2e2;color:#b91c1c;}
/* Action cards */
.act-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:.9rem;padding:0 2rem;}
.act-card{background:var(--card);border:1px solid var(--border);border-radius:14px;
  padding:1.1rem 1.3rem;text-align:center;transition:transform .2s;}
.act-card:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(0,0,0,.08);}
.act-icon{font-size:1.5rem;margin-bottom:.4rem;}
.act-num{font-size:1.85rem;font-weight:900;color:var(--text);line-height:1;}
.act-lbl{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin-top:.25rem;}
/* Recovery */
.recov-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:.9rem;padding:0 2rem;}
.recov-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:1.1rem 1.3rem;}
/* Hidden opps */
.hopp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:1rem;padding:0 2rem;}
.hopp{background:var(--card);border:1px solid var(--border);border-radius:14px;
  padding:1.2rem 1.4rem;transition:all .2s;}
.hopp:hover{border-color:#c7d2fe;transform:translateY(-2px);box-shadow:0 6px 18px rgba(79,70,229,.08);}
/* Chart */
.chart-box{background:var(--card);border:1px solid var(--border);border-radius:16px;
  margin:0 2rem;padding:1.4rem;height:250px;}
/* Fade-in */
.fade{opacity:0;transform:translateY(14px);transition:opacity .5s,transform .5s;}
.fade.vis{opacity:1;transform:none;}
/* Exec kpi mini */
.exec-kpi-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:.9rem;margin-bottom:1.5rem;}
.exec-kpi{background:#fff;border:1px solid var(--border);border-radius:10px;padding:.9rem 1rem;box-shadow:0 1px 4px rgba(0,0,0,.04);}
.ek-lbl{font-size:.62rem;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin-bottom:.3rem;}
.ek-val{font-size:1.15rem;font-weight:900;color:var(--text);}
/* Responsive */
@media(max-width:900px){
  .prob-grid,.sim-grid,.lead-grid{grid-template-columns:1fr;}
  .exec-decisions{grid-template-columns:1fr;}
}
</style>
{% endblock %}

{% block content %}
<div class="tcc">

  <div class="hero">
    <div style="display:flex;align-items:center;gap:1rem;flex-wrap:wrap">
      <div>
        <div class="hero-title">Target Achievement Command Center</div>
        <div class="hero-sub" id="h-sub">AI-Powered Quarterly Repeat Customer Intelligence</div>
      </div>
      <div id="h-pill" style="margin-left:auto"></div>
    </div>
  </div>

  <div class="qbar">
    <span class="qbar-title">Quarter</span>
    <button class="qbtn {% if active_quarter == 'AMJ' %}active{% endif %}" id="qbtn-AMJ" onclick="loadQ('AMJ')">AMJ</button>
    <button class="qbtn {% if active_quarter == 'JAS' %}active{% endif %}" id="qbtn-JAS" onclick="loadQ('JAS')">JAS</button>
    <button class="qbtn {% if active_quarter == 'OND' %}active{% endif %}" id="qbtn-OND" onclick="loadQ('OND')">OND</button>
    <button class="qbtn {% if active_quarter == 'JFM' %}active{% endif %}" id="qbtn-JFM" onclick="loadQ('JFM')">JFM</button>
    <div class="qlast" id="qlast">Loading...</div>
  </div>

  <div id="main">
    <div class="tcc-loading"><div class="spin"></div><div>Loading Command Center...</div></div>
  </div>

</div>

<script>
var TCC = null;
var AQ = '{{ active_quarter }}';
var BC = null; // burn chart instance

function n(v){ return Number(v||0).toLocaleString('en-IN'); }
function nr(v){ return '&#8377;' + Number(v||0).toFixed(1) + 'L'; }
function pct(v){ return (Number(v||0)).toFixed(1) + '%'; }

function pill(status){
  var cls = status === 'ON TRACK' ? 's-ok' : (status === 'RECOVERABLE' ? 's-rec' : 's-risk');
  return '<span class="spill ' + cls + '">' + (status||'AT RISK') + '</span>';
}
function risk(r){
  var cls = r === 'HIGH' ? 'rH' : r === 'MEDIUM' ? 'rM' : 'rL';
  return '<span class="risk ' + cls + '">' + r + '</span>';
}
function stars(p){ var s=''; for(var i=0;i<5;i++) s+= i<p ? '&#9733;' : '&#9734;'; return s; }

function buildGauge(prob){
  var cx=100, cy=100, r=78;
  var startA = -210, endA = 30;
  var arc = (endA - startA) * (prob/100);
  function polar(deg, rr){
    var rad = (deg-90)*Math.PI/180;
    return {x: cx+rr*Math.cos(rad), y: cy+rr*Math.sin(rad)};
  }
  function arcPath(from, to, ri, ro){
    var s1=polar(from,ro), s2=polar(from,ri);
    var e1=polar(to,ro), e2=polar(to,ri);
    var lg = (to-from)>180?1:0;
    return 'M '+s1.x+' '+s1.y+' A '+ro+' '+ro+' 0 '+lg+' 1 '+e1.x+' '+e1.y+' L '+e2.x+' '+e2.y+' A '+ri+' '+ri+' 0 '+lg+' 0 '+s2.x+' '+s2.y+' Z';
  }
  var track = arcPath(startA, endA, 62, 80);
  var fill  = arcPath(startA, startA+arc, 62, 80);
  var gc = prob>=75?'#16a34a':prob>=55?'#d97706':'#dc2626';
  return '<svg width="200" height="200" viewBox="0 0 200 200">' +
    '<path d="'+track+'" fill="rgba(255,255,255,0.05)"/>' +
    '<path d="'+fill+'" fill="'+gc+'" opacity="0.9" style="filter:drop-shadow(0 0 8px '+gc+'50)"/>' +
    '<text x="100" y="96" text-anchor="middle" fill="'+gc+'" font-size="30" font-weight="900" font-family="Inter,sans-serif">'+prob+'%</text>' +
    '<text x="100" y="116" text-anchor="middle" fill="#7a8cb0" font-size="10" font-family="Inter,sans-serif">PROBABILITY</text>' +
    '</svg>';
}

function renderPage(d){
  TCC = d;
  var k = d.target_kpis || {};
  var pb = d.probability_engine || {};
  var da = d.daily_action_plan || {};
  var br = d.branch_opportunities || [];
  var sg = d.opportunity_segments || [];
  var cp = d.campaign_intelligence || [];
  var rv = d.recovery_tracker || {};
  var ho = d.hidden_opportunities || [];
  var rc = d.risk_center || {};
  var bm = d.branch_action_matrix || [];
  var lb = d.leaderboard || {};
  var re = d.ai_recommendations || [];
  var wf = d.whatif_params || {};
  var ex = d.executive_summary || {};
  var hi = d.quarter_history || [];

  document.getElementById('h-sub').textContent = d.quarter_label + ' | Live Data as of ' + d.today + ' | AI Intelligence';
  document.getElementById('h-pill').innerHTML = pill(k.status);
  document.getElementById('qlast').textContent = 'Updated: ' + new Date().toLocaleTimeString('en-IN');

  var html = '';

  /* S1 Target KPIs */
  html += sec('S1','#4f46e5','Target Command Center','Quarter Achievement | Forecast | Probability | Status');
  html += '<div class="kpi-grid">';
  var kpis = [
    {lbl:'Quarter Target', val:n(k.target), sub:'10% of base customers', c:'#6366f1'},
    {lbl:'Achieved', val:n(k.achieved), sub:pct(k.ach_pct)+' of target', c:'#22c55e'},
    {lbl:'Gap Remaining', val:n(k.gap), sub:k.days_rem+' days left', c:'#ef4444'},
    {lbl:'Forecast Final', val:n(k.forecast), sub:'At current pace', c:'#f59e0b'},
    {lbl:'Daily Rate', val:n(k.daily_rate), sub:'Need: '+n(k.req_daily)+'/day', c:'#0ea5e9'},
    {lbl:'AI Probability', val:pct(k.probability), sub:'Success likelihood', c:'#4f46e5'},
    {lbl:'Confidence', val:pct(k.confidence), sub:'Model confidence', c:'#ea580c'},
    {lbl:'Status', val:pill(k.status), sub:k.days_done+'/'+k.days_total+' days done', c:k.risk_color||'#f59e0b', raw:true},
  ];
  kpis.forEach(function(ki){
    html += '<div class="kpi" style="--ka:'+ki.c+'">';
    html += '<div class="kpi-lbl">'+ki.lbl+'</div>';
    html += '<div class="kpi-val">'+(ki.raw?ki.val:'<span>'+ki.val+'</span>')+'</div>';
    html += '<div class="kpi-sub">'+ki.sub+'</div></div>';
  });
  html += '</div>';
  html += '<div class="chart-box" style="margin-top:1.5rem"><canvas id="burnChart"></canvas></div>';
  html += divider();

  /* S2 Probability */
  html += sec('S2','#7c3aed','AI Probability Engine','Machine learning prediction | Best/Worst case | Factor analysis');
  html += '<div class="prob-grid">';
  html += '<div class="gauge-wrap">' + buildGauge(pb.probability||0);
  html += '<div class="gauge-lbl">' + (pb.interpretation||'') + '</div></div>';
  html += '<div class="prob-cards">';
  var pbc = [
    {lbl:'Likely Final', val:n(pb.likely_final), c:'#e2e8f0'},
    {lbl:'Best Case', val:n(pb.best_case), c:'#16a34a'},
    {lbl:'Worst Case', val:n(pb.worst_case), c:'#dc2626'},
    {lbl:'Confidence', val:pct(pb.confidence), c:'#4f46e5'},
  ];
  pbc.forEach(function(p){
    html += '<div class="prob-card"><div class="pc-lbl">'+p.lbl+'</div><div class="pc-val" style="color:'+p.c+'">'+p.val+'</div></div>';
  });
  if(pb.factors) pb.factors.forEach(function(f){
    html += '<div class="prob-card" style="grid-column:span 2"><div class="pc-lbl">'+f.name+'<span style="float:right;color:#4f46e5">'+f.score+'%</span></div>';
    html += '<div class="cbar"><div class="cfill" style="width:'+Math.min(f.score,100)+'%;background:linear-gradient(90deg,#6366f1,#8b5cf6)"></div></div></div>';
  });
  html += '</div></div>';
  html += divider();

  /* S3 Daily Action */
  html += sec('S3','#f59e0b',"Today's Action Plan",'Daily targets | Current pace | Per-hour breakdown');
  html += '<div class="act-grid">';
  var acts = [
    {icon:'&#127919;', num:n(da.need_today), lbl:'Need Today'},
    {icon:'&#9989;', num:n(da.current_today), lbl:'Current Pace'},
    {icon:'&#9888;', num:n(da.gap_today), lbl:'Gap Remaining'},
    {icon:'&#8987;', num:da.hours_remaining||0, lbl:'Hours Left'},
    {icon:'&#128200;', num:n(da.need_per_hour), lbl:'Need / Hour'},
    {icon:'&#9201;', num:(da.need_per_minute||0).toFixed(1), lbl:'Need / Minute'},
  ];
  acts.forEach(function(a){
    html += '<div class="act-card"><div class="act-icon">'+a.icon+'</div><div class="act-num">'+a.num+'</div><div class="act-lbl">'+a.lbl+'</div></div>';
  });
  html += '</div>';
  var pac = da.pace_status === 'ON TRACK';
  html += '<div style="padding:1rem 2rem 0"><div style="background:#fff;border:1px solid var(--border);border-radius:12px;padding:.9rem 1.4rem;display:flex;align-items:center;gap:1rem">';
  html += '<span style="font-size:1.3rem">'+(pac?'&#128994;':'&#128308;')+'</span>';
  html += '<div><div style="font-size:.83rem;font-weight:700;color:var(--text)">Today: <span style="color:'+(pac?'#16a34a':'#dc2626')+'">'+(da.pace_status||'BEHIND')+'</span></div>';
  html += '<div style="font-size:.72rem;color:var(--muted)">Achieved '+n(da.current_today)+' of '+n(da.need_today)+' target — '+da.hours_remaining+' business hours remaining</div></div></div></div>';
  html += divider();

  /* S4 Opportunity Segments */

function sec(id, c, title, sub){
  return '<div id="tcc-'+id+'" class="fade"><div class="tcc-sec"><div class="tcc-sec-hd">' +
    '<div class="sec-icon" style="background:'+c+'"></div>' +
    '<div><div class="sec-title">'+title+'</div><div class="sec-sub">'+sub+'</div></div>' +
    '</div></div>';
}
function divider(){ return '<div class="tcc-divider"></div></div>'; }
function row(lbl,val){ return '<div class="cg-row"><span class="cg-lbl">'+lbl+'</span><span class="cg-val">'+val+'</span></div>'; }

function updSim(){
  if(!TCC) return;
  var k = TCC.target_kpis||{};
  var conv = parseFloat((document.getElementById('sc-conv')||{value:0}).value)/100;
  var camp = parseFloat((document.getElementById('sc-camp')||{value:0}).value)/100;
  var staf = parseFloat((document.getElementById('sc-staff')||{value:0}).value)/100;
  var days = parseInt((document.getElementById('sc-days')||{value:0}).value);

  var scv = document.getElementById('sc-conv-v'); if(scv) scv.textContent = (conv*100).toFixed(1)+'%';
  var sca = document.getElementById('sc-camp-v'); if(sca) sca.textContent = (camp*100).toFixed(0)+'%';
  var scs = document.getElementById('sc-staff-v'); if(scs) scs.textContent = (staf*100).toFixed(0)+'%';
  var scd = document.getElementById('sc-days-v'); if(scd) scd.textContent = days+'d';

  var base = k.daily_rate||0;
  var nr2 = base*(1+conv+camp+staf);
  var dr = (k.days_rem||0)+days;
  var na = Math.min(Math.round((k.achieved||0)+nr2*dr), Math.round((k.target||529364)*1.08));
  var gain = Math.max(0, na-(k.forecast||0));
  var ng = Math.max(0,(k.target||529364)-na);
  var dFrac = (k.days_done||0)/Math.max(k.days_total||92,1);
  var rr = Math.min(nr2/Math.max(k.req_daily||1,1),1.4);
  var np = Math.max(5,Math.min(99,(0.45*(na/(k.target||529364))*(1/Math.max(1-dFrac+0.05,0.05))+0.35*rr+0.2*0.88)*100));

  var ea = document.getElementById('so-ach'); if(ea) ea.textContent = n(na);
  var ep = document.getElementById('so-prob'); if(ep){ ep.textContent = np.toFixed(1)+'%'; ep.style.color=np>=75?'#16a34a':np>=55?'#d97706':'#dc2626'; }
  var eg = document.getElementById('so-gain'); if(eg) eg.textContent = '+'+n(gain);
  var gg = document.getElementById('so-gap');  if(gg) gg.textContent = n(ng);
}

function loadQ(q){
  AQ = q;
  document.querySelectorAll('.qbtn').forEach(function(b){ b.classList.toggle('active', b.id === 'qbtn-'+q); });
  document.getElementById('main').innerHTML = '<div class="tcc-loading"><div class="spin"></div><div>Loading '+q+' data...</div></div>';
  fetch('/api/v1/target-command-center/?quarter='+q)
    .then(function(r){ return r.json(); })
    .then(function(data){
      if(data.status === 'error') throw new Error(data.message);
      renderPage(data);
    })
    .catch(function(err){
      document.getElementById('main').innerHTML =
        '<div class="tcc-loading" style="color:#dc2626"><div style="font-size:1.3rem;margin-bottom:.5rem">Error loading data</div><div style="font-size:.8rem;opacity:.8">'+err.message+'</div><button onclick="loadQ(\''+q+'\')" style="margin-top:1rem;padding:.5rem 1.5rem;background:#6366f1;color:#fff;border:none;border-radius:8px;cursor:pointer">Retry</button></div>';
    });
}

document.addEventListener('DOMContentLoaded', function(){ loadQ(AQ); });
</script>
