{% extends 'base.html' %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="fw-bold m-0">Payment Analytics</h2>
</div>

<div class="row g-4">
    <div class="col-md-7">
        <div class="card h-100">
            <div class="card-header pb-0 border-0">
                <h5 class="card-title mb-0">Payment Type Volume</h5>
            </div>
            <div class="card-body">
                <canvas id="pymtBarChart" style="height: 350px;"></canvas>
            </div>
        </div>
    </div>
    <div class="col-md-5">
        <div class="card h-100">
            <div class="card-header pb-0 border-0">
                <h5 class="card-title mb-0">Payment Distribution</h5>
            </div>
            <div class="card-body d-flex justify-content-center align-items-center">
                <canvas id="pymtPieChart" style="max-height: 300px;"></canvas>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    let barChart = null;
    let pieChart = null;

    document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
    document.querySelector('.nav-link[href="{% url 'payments' %}"]').classList.add('active');

    async function loadPaymentData(filterStr = "") {
        window.showLoading();
        try {
            const response = await fetch(`/api/v1/payment-analytics/?${filterStr}`);
            const data = await response.json();
            
            const dist = data.distribution;
            
            // Sort by value descending
            const entries = Object.entries(dist).sort((a,b) => b[1] - a[1]);
            const labels = entries.map(e => e[0]);
            const values = entries.map(e => e[1]);
            
            // Colors
            const baseColors = [
                '#3b82f6', '#10b981', '#f59e0b', '#8b5cf6', '#ec4899',
                '#14b8a6', '#f97316', '#06b6d4', '#6366f1', '#84cc16'
            ];
            
            const bgColors = labels.map((_, i) => baseColors[i % baseColors.length]);
            
            // Bar Chart
            if(barChart) barChart.destroy();
            const ctxBar = document.getElementById('pymtBarChart').getContext('2d');
            barChart = new Chart(ctxBar, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Revenue',
                        data: values,
                        backgroundColor: bgColors,
                        borderRadius: 4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        y: { 
                            grid: { color: '#334155' },
                            ticks: { 
                                color: '#94a3b8',
                                callback: function(val) { return '₹' + (val/100000).toFixed(0) + 'L'; }
                            }
                        },
                        x: { 
                            grid: { display: false },
                            ticks: { color: '#94a3b8', maxRotation: 45, minRotation: 45 }
                        }
                    }
                }
            });

            // Pie Chart
            if(pieChart) pieChart.destroy();
            const ctxPie = document.getElementById('pymtPieChart').getContext('2d');
            pieChart = new Chart(ctxPie, {
                type: 'doughnut',
                data: {
                    labels: labels,
                    datasets: [{
                        data: values,
                        backgroundColor: bgColors,
                        borderWidth: 0,
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { position: 'right', labels: { color: '#f8fafc', boxWidth: 12 } }
                    }
                }
            });

        } catch(e) {
            console.error(e);
        } finally {
            if (typeof window.hideLoading === 'function') window.hideLoading();
        }
    }

    loadPaymentData();

    window.addEventListener('filtersUpdated', (e) => {
        loadPaymentData(e.detail);
    });
</script>
{% endblock %}
