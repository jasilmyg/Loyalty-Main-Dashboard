{% extends 'base.html' %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="fw-bold m-0">Sales Overview</h2>
</div>

<div class="row g-4 mb-4">
    <!-- Stat Cards -->
    <div class="col-md-4">
        <div class="card stat-card p-4 h-100">
            <div class="stat-label">Total Revenue</div>
            <div class="stat-value" id="val-revenue">₹0</div>
        </div>
    </div>
    <div class="col-md-4">
        <div class="card stat-card p-4 h-100">
            <div class="stat-label">Total Invoices</div>
            <div class="stat-value" id="val-invoices">0</div>
        </div>
    </div>
    <div class="col-md-4">
        <div class="card stat-card p-4 h-100">
            <div class="stat-label">Average Transaction Value (ATV)</div>
            <div class="stat-value" id="val-atv">₹0</div>
        </div>
    </div>
</div>

<div class="row g-4">
    <!-- Charts -->
    <div class="col-12">
        <div class="card h-100">
            <div class="card-header pb-0 border-0">
                <h5 class="card-title mb-0">Monthly Revenue Trend</h5>
            </div>
            <div class="card-body">
                <canvas id="revenueChart" style="height: 300px;"></canvas>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    let revenueChartInstance = null;
    
    // Nav active state is handled server-side in base.html

    async function loadDashboardData(filterStr = "") {
        window.showLoading();
        try {
            const baseUrl = "{% url 'api-sales-overview' %}";
            const url = filterStr ? `${baseUrl}?${filterStr}` : baseUrl;
            const response = await fetch(url);
            const data = await response.json();
            
            // Update Stat Cards
            document.getElementById('val-revenue').innerText = formatCurrency(data.total_revenue);
            document.getElementById('val-invoices').innerText = new Intl.NumberFormat('en-IN').format(data.total_invoices);
            document.getElementById('val-atv').innerText = formatCurrency(data.atv);
            
            // Prepare Chart Data
            const labels = data.monthly_trend.map(d => d.month);
            const values = data.monthly_trend.map(d => d.revenue);
            
            if(revenueChartInstance) {
                revenueChartInstance.destroy();
            }
            
            const ctx = document.getElementById('revenueChart').getContext('2d');
            revenueChartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Revenue',
                        data: values,
                        borderColor: '#3b82f6',
                        backgroundColor: 'rgba(59, 130, 246, 0.1)',
                        borderWidth: 2,
                        fill: true,
                        tension: 0.4,
                        pointBackgroundColor: '#1e40af',
                        pointBorderColor: '#fff',
                        pointHoverBackgroundColor: '#fff',
                        pointHoverBorderColor: '#1e40af'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false }
                    },
                    scales: {
                        y: {
                            grid: { color: '#e2e8f0' },
                            ticks: { 
                                color: '#64748b',
                                callback: function(value) { return '₹' + (value/100000).toFixed(1) + 'L'; }
                            }
                        },
                        x: {
                            grid: { display: false },
                            ticks: { color: '#64748b' }
                        }
                    }
                }
            });
        } catch(e) {
            console.error(e);
        } finally {
            if (typeof window.hideLoading === 'function') window.hideLoading();
        }
    }

    // Load initial data
    loadDashboardData();

    // Listen to filter updates
    window.addEventListener('filtersUpdated', (e) => {
        loadDashboardData(e.detail);
    });
</script>
{% endblock %}
