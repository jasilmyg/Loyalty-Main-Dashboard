{% extends 'base.html' %}

{% block content %}
<!-- Preload React and ReactDOM -->
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<!-- Recharts for React visualization -->
<script src="https://unpkg.com/prop-types/prop-types.min.js"></script>
<script src="https://unpkg.com/recharts/umd/Recharts.min.js"></script>

<style>
    /* Premium Design System */
    :root {
        --bg-color: #0f172a;
        --card-bg: rgba(30, 41, 59, 0.7);
        --card-border: rgba(255, 255, 255, 0.1);
        --text-primary: #f8fafc;
        --text-secondary: #94a3b8;
        --accent-1: #3b82f6; /* Blue */
        --accent-2: #8b5cf6; /* Purple */
        --accent-3: #10b981; /* Green */
        --accent-4: #f43f5e; /* Rose */
    }

    /* Override base.html styles for the react dashboard specifically */
    body {
        background-color: var(--bg-color);
        color: var(--text-primary);
    }
    
    .filter-bar, .main-content > .card {
        display: none !important; /* Hide old elements if needed */
    }

    .main-content {
        padding: 0;
        background: radial-gradient(circle at top left, #1e1b4b, #0f172a 60%);
    }

    .react-container {
        padding: 2rem;
        min-height: 100vh;
        animation: fadeIn 0.8s ease-out;
    }

    /* Glassmorphism Cards */
    .glass-card {
        background: var(--card-bg);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid var(--card-border);
        border-radius: 16px;
        padding: 1.5rem;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .glass-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
        border: 1px solid rgba(255, 255, 255, 0.2);
    }

    /* Typography */
    .dashboard-title {
        font-size: 2.5rem;
        font-weight: 800;
        background: linear-gradient(135deg, #60a5fa, #c084fc);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        margin-bottom: 0.5rem;
    }

    .dashboard-subtitle {
        color: var(--text-secondary);
        font-size: 1.1rem;
        margin-bottom: 2rem;
    }

    /* KPI Values */
    .kpi-value {
        font-size: 2.2rem;
        font-weight: 700;
        margin: 0.5rem 0;
        color: #ffffff;
    }
    
    .kpi-label {
        font-size: 0.9rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--text-secondary);
    }

    .kpi-icon {
        width: 48px;
        height: 48px;
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.5rem;
        margin-bottom: 1rem;
    }

    .icon-blue { background: rgba(59, 130, 246, 0.2); color: var(--accent-1); }
    .icon-purple { background: rgba(139, 92, 246, 0.2); color: var(--accent-2); }
    .icon-green { background: rgba(16, 185, 129, 0.2); color: var(--accent-3); }
    .icon-rose { background: rgba(244, 63, 94, 0.2); color: var(--accent-4); }

    /* Layout Grids */
    .kpi-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        gap: 1.5rem;
        margin-bottom: 2rem;
    }

    .charts-grid {
        display: grid;
        grid-template-columns: 2fr 1fr;
        gap: 1.5rem;
    }

    @media (max-width: 1024px) {
        .charts-grid {
            grid-template-columns: 1fr;
        }
    }

    /* Animations */
    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .pulse-loading {
        animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        height: 400px;
        border-radius: 16px;
        background: rgba(255,255,255,0.05);
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--text-secondary);
    }

    @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: .5; }
    }
</style>

<!-- React Mount Point -->
<div id="react-root"></div>

<script type="text/babel">
{% verbatim %}
    const { useState, useEffect, useMemo } = React;
    const { 
        LineChart, Line, XAxis, YAxis, CartesianGrid, Tooltip, Legend, ResponsiveContainer,
        AreaChart, Area, PieChart, Pie, Cell, BarChart, Bar
    } = window.Recharts;

    const formatCurrency = (val) => new Intl.NumberFormat('en-IN', { style: 'currency', currency: 'INR', maximumFractionDigits: 0 }).format(val);
    const formatNumber = (val) => new Intl.NumberFormat('en-IN').format(val);

    const Dashboard = () => {
        const [salesData, setSalesData] = useState(null);
        const [kpiData, setKpiData] = useState(null);
        const [rfmData, setRfmData] = useState(null);
        const [retailData, setRetailData] = useState(null);
        const [loading, setLoading] = useState(true);

        useEffect(() => {
            const fetchData = async () => {
                try {
                    // Fetch data concurrently from the new FastAPI endpoints
                    const [salesRes, kpiRes, rfmRes, retailRes] = await Promise.all([
                        axios.get('http://127.0.0.1:8001/api/v1/analytics/sales-overview'),
                        axios.get('http://127.0.0.1:8001/api/v1/analytics/loyalty-kpis'),
                        axios.get('http://127.0.0.1:8001/api/v1/analytics/rfm-segments'),
                        axios.get('http://127.0.0.1:8001/api/v1/analytics/retail-matrix?period=monthly')
                    ]);
                    setSalesData(salesRes.data);
                    setKpiData(kpiRes.data);
                    setRfmData(rfmRes.data);
                    setRetailData(retailRes.data);
                } catch (error) {
                    console.error("Error fetching dashboard data", error);
                } finally {
                    setLoading(false);
                }
            };
            fetchData();

            // Listen for filter changes from base.html
            const handleFilters = (e) => {
                console.log("Filters applied:", e.detail);
                // In a production scenario, you would parse e.detail and re-fetch here
            };
            window.addEventListener('filtersUpdated', handleFilters);
            return () => window.removeEventListener('filtersUpdated', handleFilters);
        }, []);

        if (loading) {
            return (
                <div className="react-container">
                    <div className="dashboard-title">Loyalty Overview</div>
                    <div className="dashboard-subtitle">Fetching live metrics...</div>
                    <div className="pulse-loading">
                        <h3>Loading Premium Dashboard...</h3>
                    </div>
                </div>
            );
        }

        // Colors for RFM
        const getRfmColor = (segment) => {
            if(segment === 'Champions') return '#10b981';
            if(segment === 'Loyal') return '#3b82f6';
            if(segment === 'New') return '#8b5cf6';
            if(segment === 'At Risk') return '#f59e0b';
            if(segment === 'Lost') return '#ef4444';
            return '#64748b';
        };

        return (
            <div className="react-container">
                <div className="d-flex justify-content-between align-items-center mb-4">
                    <div>
                        <h1 className="dashboard-title">Premium Analytics</h1>
                        <p className="dashboard-subtitle">Real-time AI-powered loyalty insights</p>
                    </div>
                    <div>
                        <span className="badge" style={{background: 'rgba(16, 185, 129, 0.2)', color: '#10b981', padding: '8px 16px', borderRadius: '20px', fontSize: '0.9rem'}}>
                            <i className="bi bi-broadcast me-2"></i> Live Sync
                        </span>
                    </div>
                </div>

                {/* KPI Grid */}
                <div className="kpi-grid">
                    <div className="glass-card">
                        <div className="kpi-icon icon-blue">
                            <i className="bi bi-currency-rupee"></i>
                        </div>
                        <div className="kpi-label">Total Revenue</div>
                        <div className="kpi-value">{salesData ? formatCurrency(salesData.total_revenue) : '₹0'}</div>
                    </div>
                    <div className="glass-card">
                        <div className="kpi-icon icon-purple">
                            <i className="bi bi-people-fill"></i>
                        </div>
                        <div className="kpi-label">Total Customers</div>
                        <div className="kpi-value">{kpiData ? formatNumber(kpiData.total_customers) : '0'}</div>
                    </div>
                    <div className="glass-card">
                        <div className="kpi-icon icon-green">
                            <i className="bi bi-arrow-repeat"></i>
                        </div>
                        <div className="kpi-label">Repeat Rate</div>
                        <div className="kpi-value">{kpiData ? kpiData.repeat_rate + '%' : '0%'}</div>
                    </div>
                    <div className="glass-card">
                        <div className="kpi-icon icon-rose">
                            <i className="bi bi-clock-history"></i>
                        </div>
                        <div className="kpi-label">Avg Purchase Gap</div>
                        <div className="kpi-value">{kpiData ? kpiData.avg_gap_days + ' Days' : '0 Days'}</div>
                    </div>
                </div>

                {/* Charts Grid */}
                <div className="charts-grid mb-4">
                    <div className="glass-card">
                        <h4 style={{color: 'white', marginBottom: '1.5rem', fontWeight: 600}}>Revenue Velocity</h4>
                        <div style={{width: '100%', height: 350}}>
                            <ResponsiveContainer>
                                <AreaChart data={salesData?.monthly_trend || []}>
                                    <defs>
                                        <linearGradient id="colorRev" x1="0" y1="0" x2="0" y2="1">
                                            <stop offset="5%" stopColor="#3b82f6" stopOpacity={0.4}/>
                                            <stop offset="95%" stopColor="#3b82f6" stopOpacity={0}/>
                                        </linearGradient>
                                    </defs>
                                    <CartesianGrid strokeDasharray="3 3" stroke="rgba(255,255,255,0.1)" vertical={false} />
                                    <XAxis dataKey="month" stroke="#94a3b8" tick={{fill: '#94a3b8'}} />
                                    <YAxis stroke="#94a3b8" tick={{fill: '#94a3b8'}} tickFormatter={(val) => '₹' + (val/1000000).toFixed(1) + 'M'} />
                                    <Tooltip 
                                        contentStyle={{backgroundColor: 'rgba(15, 23, 42, 0.9)', border: '1px solid rgba(255,255,255,0.1)', borderRadius: '8px', color: '#fff'}}
                                        formatter={(val) => [formatCurrency(val), "Revenue"]}
                                    />
                                    <Area type="monotone" dataKey="revenue" stroke="#3b82f6" strokeWidth={3} fillOpacity={1} fill="url(#colorRev)" />
                                </AreaChart>
                            </ResponsiveContainer>
                        </div>
                    </div>

                    <div className="glass-card">
                        <h4 style={{color: 'white', marginBottom: '1.5rem', fontWeight: 600}}>Customer Retention</h4>
                        <div style={{width: '100%', height: 350, display: 'flex', flexDirection: 'column', justifyContent: 'center'}}>
                            {kpiData && (
                                <ResponsiveContainer>
                                    <PieChart>
                                        <Pie
                                            data={[
                                                {name: 'Repeat Customers', value: kpiData.repeat_customers},
                                                {name: 'New Customers', value: kpiData.total_customers - kpiData.repeat_customers}
                                            ]}
                                            cx="50%" cy="50%"
                                            innerRadius={80}
                                            outerRadius={120}
                                            paddingAngle={5}
                                            dataKey="value"
                                        >
                                            <Cell fill="#8b5cf6" />
                                            <Cell fill="rgba(139, 92, 246, 0.2)" stroke="#8b5cf6" />
                                        </Pie>
                                        <Tooltip 
                                            contentStyle={{backgroundColor: 'rgba(15, 23, 42, 0.9)', border: '1px solid rgba(255,255,255,0.1)', borderRadius: '8px', color: '#fff'}}
                                            formatter={(val) => [formatNumber(val), "Customers"]}
                                        />
                                    </PieChart>
                                </ResponsiveContainer>
                            )}
                        </div>
                    </div>

                    <div className="glass-card">
                        <h4 style={{color: 'white', marginBottom: '1.5rem', fontWeight: 600}}>RFM Segment Breakdown</h4>
                        <div style={{width: '100%', height: 350}}>
                            <ResponsiveContainer>
                                <BarChart layout="vertical" data={rfmData || []} margin={{left: 20, right: 20}}>
                                    <CartesianGrid strokeDasharray="3 3" stroke="rgba(255,255,255,0.1)" horizontal={false} />
                                    <XAxis type="number" stroke="#94a3b8" tick={{fill: '#94a3b8'}} />
                                    <YAxis type="category" dataKey="segment" stroke="#94a3b8" tick={{fill: '#94a3b8'}} width={80} />
                                    <Tooltip 
                                        cursor={{fill: 'rgba(255,255,255,0.05)'}}
                                        contentStyle={{backgroundColor: 'rgba(15, 23, 42, 0.9)', border: '1px solid rgba(255,255,255,0.1)', borderRadius: '8px', color: '#fff'}}
                                    />
                                    <Bar dataKey="count" radius={[0, 4, 4, 0]}>
                                        {(rfmData || []).map((entry, index) => (
                                            <Cell key={`cell-${index}`} fill={getRfmColor(entry.segment)} />
                                        ))}
                                    </Bar>
                                </BarChart>
                            </ResponsiveContainer>
                        </div>
                    </div>
                </div>

                {/* Retail Matrix Table */}
                <div className="glass-card">
                    <h4 style={{color: 'white', marginBottom: '1.5rem', fontWeight: 600}}>Retail Loyalty Performance Matrix</h4>
                    <div className="table-responsive">
                        <table className="table table-dark table-hover" style={{backgroundColor: 'transparent', '--bs-table-bg': 'transparent'}}>
                            <thead>
                                <tr>
                                    <th style={{color: '#94a3b8', borderBottom: '1px solid rgba(255,255,255,0.1)'}}>Period</th>
                                    <th style={{color: '#94a3b8', borderBottom: '1px solid rgba(255,255,255,0.1)'}}>Active Members</th>
                                    <th style={{color: '#94a3b8', borderBottom: '1px solid rgba(255,255,255,0.1)'}}>New Members</th>
                                    <th style={{color: '#94a3b8', borderBottom: '1px solid rgba(255,255,255,0.1)'}}>Repeat Members</th>
                                    <th style={{color: '#94a3b8', borderBottom: '1px solid rgba(255,255,255,0.1)'}}>Total Visits</th>
                                    <th style={{color: '#94a3b8', borderBottom: '1px solid rgba(255,255,255,0.1)'}}>Repeat %</th>
                                </tr>
                            </thead>
                            <tbody>
                                {(retailData || []).map((row, i) => {
                                    const repeatPct = row.total_m > 0 ? ((row.repeat_m / row.total_m) * 100).toFixed(1) : 0;
                                    return (
                                        <tr key={i}>
                                            <td style={{borderBottom: '1px solid rgba(255,255,255,0.05)', fontWeight: 600}}>{row.period}</td>
                                            <td style={{borderBottom: '1px solid rgba(255,255,255,0.05)'}}>{formatNumber(row.total_m)}</td>
                                            <td style={{borderBottom: '1px solid rgba(255,255,255,0.05)', color: '#10b981'}}>{formatNumber(row.new_m)}</td>
                                            <td style={{borderBottom: '1px solid rgba(255,255,255,0.05)', color: '#8b5cf6'}}>{formatNumber(row.repeat_m)}</td>
                                            <td style={{borderBottom: '1px solid rgba(255,255,255,0.05)'}}>{formatNumber(row.total_v)}</td>
                                            <td style={{borderBottom: '1px solid rgba(255,255,255,0.05)'}}>
                                                <span className="badge" style={{background: 'rgba(59, 130, 246, 0.2)', color: '#3b82f6'}}>{repeatPct}%</span>
                                            </td>
                                        </tr>
                                    );
                                })}
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        );
    };

    const root = ReactDOM.createRoot(document.getElementById('react-root'));
    root.render(<Dashboard />);
{% endverbatim %}
</script>
{% endblock %}
