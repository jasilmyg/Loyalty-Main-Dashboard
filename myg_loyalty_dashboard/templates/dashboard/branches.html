{% extends 'base.html' %}

{% block content %}
<div class="mb-4">
    <h2 class="fw-bold m-0">Branch Performance</h2>
</div>

<div class="card mt-4">
    <div class="card-header pb-0 border-0">
        <h5 class="card-title mb-0">Branches Ranked by Revenue</h5>
    </div>
    <div class="card-body">
        <div class="table-responsive">
            <table class="table table-dark table-hover mb-0">
                <thead>
                    <tr>
                        <th>Branch</th>
                        <th class="text-end">Revenue</th>
                        <th class="text-center">Transactions</th>
                        <th class="text-center">Customers</th>
                        <th class="text-end">ATV</th>
                    </tr>
                </thead>
                <tbody id="branch-tbody"></tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
    document.querySelector('.nav-link[href="{% url 'branches' %}"]').classList.add('active');

    async function loadData(filterStr = "") {
        window.showLoading();
        try {
            const response = await fetch(`/api/v1/branch-performance/?${filterStr}`);
            const data = await response.json();
            
            const tbody = document.getElementById('branch-tbody');
            tbody.innerHTML = '';
            
            data.forEach(row => {
                tbody.innerHTML += `
                    <tr>
                        <td><i class="bi bi-shop text-warning me-2"></i> ${row.branch}</td>
                        <td class="text-end fw-bold text-success">${formatCurrency(row.revenue)}</td>
                        <td class="text-center">${row.transactions}</td>
                        <td class="text-center">${row.customers}</td>
                        <td class="text-end">${formatCurrency(row.atv)}</td>
                    </tr>
                `;
            });
        } catch(e) {
            console.error(e);
        } finally {
            if (typeof window.hideLoading === 'function') window.hideLoading();
        }
    }

    loadData();
    window.addEventListener('filtersUpdated', (e) => loadData(e.detail));
</script>
{% endblock %}
