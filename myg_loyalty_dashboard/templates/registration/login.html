{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - myG Loyalty Analytics</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            color: #0f172a;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        /* Animated Background Elements */
        .bg-shape {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.5;
            z-index: -1;
            animation: float 10s infinite ease-in-out alternate;
        }
        .shape-1 {
            width: 400px;
            height: 400px;
            background: rgba(249, 115, 22, 0.3); /* Orange */
            top: -100px;
            right: -100px;
        }
        .shape-2 {
            width: 500px;
            height: 500px;
            background: rgba(59, 130, 246, 0.1); /* Subtle Blue */
            bottom: -150px;
            left: -150px;
            animation-delay: -5s;
        }

        @keyframes float {
            0% { transform: translateY(0) scale(1); }
            100% { transform: translateY(-40px) scale(1.05); }
        }

        /* Card Animation & Styling */
        .login-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.05), 0 1px 3px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 440px;
            padding: 3rem;
            transform: translateY(30px);
            opacity: 0;
            animation: slideUpFade 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes slideUpFade {
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        /* Input Styling */
        .form-control {
            background-color: #ffffff;
            border: 1.5px solid #e2e8f0;
            color: #0f172a;
            border-radius: 12px;
            padding: 0.75rem 1.25rem;
            font-size: 1rem;
            transition: all 0.3s ease;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.01);
        }
        .form-control:focus {
            background-color: #ffffff;
            border-color: #f97316;
            box-shadow: 0 0 0 4px rgba(249, 115, 22, 0.1);
            outline: none;
        }
        .form-label {
            font-weight: 600;
            font-size: 0.85rem;
            color: #475569;
            margin-bottom: 0.5rem;
            letter-spacing: 0.5px;
        }
        .input-icon {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            z-index: 10;
            color: #94a3b8;
            font-size: 1.1rem;
        }

        /* Button Styling */
        .btn-primary {
            background: linear-gradient(135deg, #f97316 0%, #ea580c 100%);
            border: none;
            border-radius: 12px;
            padding: 0.8rem;
            font-weight: 600;
            font-size: 1.05rem;
            color: #ffffff;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(249, 115, 22, 0.3);
            position: relative;
            overflow: hidden;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(249, 115, 22, 0.4);
        }
        .btn-primary:active {
            transform: translateY(0);
        }

        /* Error Styling */
        .alert-danger {
            background-color: #fef2f2;
            border: 1px solid #fca5a5;
            color: #ef4444;
            border-radius: 12px;
            font-size: 0.9rem;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <!-- Animated Background Shapes -->
    <div class="bg-shape shape-1"></div>
    <div class="bg-shape shape-2"></div>

    <div class="login-card">
        <!-- Logo Header -->
        <div class="text-center mb-5">
            <img src="{% static 'logo.png' %}" alt="myG FUTURE Logo" style="height: 70px; object-fit: contain; margin-bottom: 1rem; animation: slideUpFade 1s 0.2s forwards; opacity: 0; transform: translateY(10px);">
            <h4 class="fw-bold mb-1" style="color: #0f172a; animation: slideUpFade 1s 0.3s forwards; opacity: 0; transform: translateY(10px);">Welcome Back</h4>
            <p class="text-muted" style="font-size: 0.9rem; animation: slideUpFade 1s 0.4s forwards; opacity: 0; transform: translateY(10px);">Sign in to access your Loyalty Dashboard</p>
        </div>
        
        {% if form.errors %}
        <div class="alert alert-danger py-3 text-center mb-4" style="animation: slideUpFade 0.5s forwards;">
            <i class="bi bi-exclamation-circle-fill me-2"></i> Invalid username or password.
        </div>
        {% endif %}
        
        <form method="post" action="{% url 'login' %}" style="animation: slideUpFade 1s 0.5s forwards; opacity: 0; transform: translateY(10px);">
            {% csrf_token %}
            <div class="mb-4">
                <label class="form-label text-uppercase">Username</label>
                <div class="position-relative">
                    <input type="text" name="username" class="form-control pe-5" placeholder="Enter your username" required autofocus>
                    <i class="bi bi-person input-icon"></i>
                </div>
            </div>
            <div class="mb-5">
                <label class="form-label text-uppercase">Password</label>
                <div class="position-relative">
                    <input type="password" name="password" class="form-control pe-5" placeholder="Enter your password" required>
                    <i class="bi bi-lock input-icon"></i>
                </div>
            </div>
            <button type="submit" class="btn btn-primary w-100">Sign In <i class="bi bi-arrow-right ms-2"></i></button>
            <input type="hidden" name="next" value="{{ next|default:'/' }}">
        </form>
    </div>

    <!-- Face Lock Modal -->
    <div id="facelock-modal" style="display:none; position:fixed; top:0; left:0; width:100vw; height:100vh; background:rgba(15, 23, 42, 0.95); z-index:9999; flex-direction:column; align-items:center; justify-content:center;">
        <div style="background:#ffffff; padding:30px; border-radius:20px; text-align:center; box-shadow:0 10px 40px rgba(0,0,0,0.2); max-width: 500px;">
            <h4 id="facelock-status" class="fw-bold mb-3" style="color: #0f172a;">Initializing Face Lock...</h4>
            <div style="position:relative; width:400px; height:300px; margin:0 auto; overflow: hidden; border-radius: 12px; border: 3px solid #f1f5f9;">
                <video id="webcam" autoplay muted playsinline style="width:100%; height:100%; object-fit: cover; background:#000;"></video>
            </div>
            <p id="facelock-msg" class="mt-3 text-muted fw-medium">Please look directly at the camera.</p>
            <button id="cancel-facelock" class="btn btn-outline-secondary mt-2 px-4 rounded-pill">Cancel Login</button>
        </div>
    </div>

    <script>
        const form = document.querySelector('form');
        const modal = document.getElementById('facelock-modal');
        const video = document.getElementById('webcam');
        const statusTxt = document.getElementById('facelock-status');
        const msgTxt = document.getElementById('facelock-msg');
        const cancelBtn = document.getElementById('cancel-facelock');
        
        let modelsLoaded = false;
        let labeledFaceDescriptors = null;

        async function initFaceAPI() {
            if(modelsLoaded) return;
            statusTxt.innerText = "Loading Security Models...";
            msgTxt.innerText = "This may take a few seconds on the first run.";
            
            const MODEL_URL = '/static/face-api/models';
            await Promise.all([
                faceapi.nets.ssdMobilenetv1.loadFromUri(MODEL_URL),
                faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL),
                faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL),
                faceapi.nets.faceExpressionNet.loadFromUri(MODEL_URL)
            ]);

            statusTxt.innerText = "Loading Face Database...";
            
            const images = [
                "WhatsApp Image 2026-05-16 at 12.20.12 PM.jpeg",
                "WhatsApp Image 2026-05-16 at 12.20.13 PM.jpeg",
                "WhatsApp Image 2026-05-16 at 12.20.14 PM (1).jpeg",
                "WhatsApp Image 2026-05-16 at 12.20.14 PM.jpeg",
                "WhatsApp Image 2026-05-16 at 12.20.16 PM (1).jpeg",
                "WhatsApp Image 2026-05-16 at 12.20.16 PM.jpeg",
                "WhatsApp Image 2026-05-16 at 12.20.17 PM (1).jpeg",
                "WhatsApp Image 2026-05-16 at 12.20.17 PM.jpeg",
                "WhatsApp Image 2026-05-16 at 12.41.42 PM.jpeg",
                "WhatsApp Image 2026-05-16 at 12.41.45 PM.jpeg",
                "WhatsApp Image 2026-05-16 at 12.41.46 PM.jpeg",
                "WhatsApp Image 2026-05-16 at 12.41.47 PM (1).jpeg",
                "WhatsApp Image 2026-05-16 at 12.41.47 PM.jpeg",
                "WhatsApp Image 2026-05-16 at 12.41.48 PM (1).jpeg",
                "WhatsApp Image 2026-05-16 at 12.41.48 PM.jpeg"
            ];
            
            const descriptors = [];
            for(let imgName of images) {
                const imgUrl = '/static/faceids/' + encodeURIComponent(imgName);
                try {
                    const img = await faceapi.fetchImage(imgUrl);
                    const detection = await faceapi.detectSingleFace(img).withFaceLandmarks().withFaceDescriptor();
                    if(detection) {
                        descriptors.push(detection.descriptor);
                    }
                } catch(e) {
                    console.error("Failed to load image:", imgName);
                }
            }
            
            if(descriptors.length > 0) {
                labeledFaceDescriptors = new faceapi.LabeledFaceDescriptors("myguser", descriptors);
            }
            modelsLoaded = true;
        }

        form.addEventListener('submit', async (e) => {
            const username = document.querySelector('input[name="username"]').value.trim();
            if(username === 'myguser') {
                e.preventDefault(); 
                modal.style.display = 'flex';
                
                try {
                    await initFaceAPI();
                    statusTxt.innerText = "Analyzing Face...";
                    statusTxt.style.color = "#ea580c";
                    msgTxt.innerText = "Please look directly at the camera. Verifying live human...";
                    
                    const stream = await navigator.mediaDevices.getUserMedia({ video: {} });
                    video.srcObject = stream;
                    
                    let yawHistory = [];
                    let identityMatched = false;

                    video.onplay = async () => {
                        if(!labeledFaceDescriptors) {
                            msgTxt.innerText = "System Error: Face database is empty.";
                            msgTxt.style.color = "red";
                            return;
                        }
                        // 0.65 threshold is much more forgiving for webcam lighting variations
                        const faceMatcher = new faceapi.FaceMatcher([labeledFaceDescriptors], 0.65); 
                        
                        const checkInterval = setInterval(async () => {
                            if(modal.style.display === 'none') {
                                clearInterval(checkInterval);
                                stream.getTracks().forEach(track => track.stop());
                                return;
                            }
                            
                            // Detect face and landmarks without expressions
                            const detection = await faceapi.detectSingleFace(video).withFaceLandmarks().withFaceDescriptor();
                            if(detection) {
                                // Check Identity
                                if(!identityMatched) {
                                    const bestMatch = faceMatcher.findBestMatch(detection.descriptor);
                                    if(bestMatch.label === "myguser") {
                                        identityMatched = true;
                                        statusTxt.innerText = "Identity Verified. Checking Liveness...";
                                    } else {
                                        msgTxt.innerText = "Face not recognized. Distance: " + bestMatch.distance.toFixed(2);
                                        msgTxt.style.color = "#ef4444";
                                        return;
                                    }
                                }

                                // Check Liveness (Passive 3D Check)
                                if(identityMatched) {
                                    const landmarks = detection.landmarks.positions;
                                    const noseTip = landmarks[30];
                                    const leftEdge = landmarks[0];
                                    const rightEdge = landmarks[16];
                                    
                                    // Calculate relative yaw: ratio of nose position between left and right face edges
                                    // For a 2D photo, this ratio is perfectly constant because the image is flat.
                                    // For a 3D live human, natural micro-movements cause this to fluctuate.
                                    const faceWidth = rightEdge.x - leftEdge.x;
                                    if (faceWidth > 0) {
                                        const yaw = (noseTip.x - leftEdge.x) / faceWidth;
                                        yawHistory.push(yaw);
                                        
                                        if(yawHistory.length > 15) {
                                            yawHistory.shift(); // Keep last 15 frames
                                        }
                                        
                                        if(yawHistory.length >= 10) {
                                            const maxYaw = Math.max(...yawHistory);
                                            const minYaw = Math.min(...yawHistory);
                                            const yawVariance = maxYaw - minYaw;
                                            
                                            // A variance > 0.015 indicates a real 3D head moving slightly
                                            if(yawVariance > 0.015) {
                                                clearInterval(checkInterval);
                                                stream.getTracks().forEach(track => track.stop());
                                                statusTxt.innerText = "Live Human Verified!";
                                                statusTxt.style.color = "#16a34a"; // Green
                                                msgTxt.innerText = "Secure login successful...";
                                                setTimeout(() => {
                                                    form.submit();
                                                }, 1000);
                                            } else {
                                                msgTxt.innerText = "Please move your head slightly to verify you are a live human.";
                                                msgTxt.style.color = "#3b82f6";
                                            }
                                        }
                                    }
                                }
                            } else {
                                msgTxt.innerText = "No face detected. Please look directly at the camera.";
                                msgTxt.style.color = "#64748b";
                                yawHistory = []; // Reset if tracking is lost
                            }
                        }, 100); // Check faster (100ms) for smoother variance tracking
                    };
                } catch (err) {
                    console.error(err);
                    statusTxt.innerText = "Camera Access Denied";
                    statusTxt.style.color = "#ef4444";
                    msgTxt.innerText = "Please allow camera access in your browser settings.";
                }
            }
        });

        cancelBtn.addEventListener('click', () => {
            modal.style.display = 'none';
            const stream = video.srcObject;
            if(stream) {
                stream.getTracks().forEach(track => track.stop());
            }
        });
    </script>
</body>
</html>
